spring:
  application:
    name: api2api
  mvc:
    async:
      request-timeout: ${API2API_GATEWAY_ASYNC_TIMEOUT:15m}
  servlet:
    multipart:
      # OpenAI Images edits/variations upload images as multipart parts; gpt-image accepts up to 50MB each.
      max-file-size: ${API2API_GATEWAY_MULTIPART_MAX_FILE_SIZE:50MB}
      max-request-size: ${API2API_GATEWAY_MULTIPART_MAX_REQUEST_SIZE:100MB}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/api2api}
    username: ${SPRING_DATASOURCE_USERNAME:api2api}
    password: ${SPRING_DATASOURCE_PASSWORD:api2api}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  servlet:
    session:
      timeout: ${API2API_LOGIN_SESSION_TIMEOUT:30d}
      cookie:
        max-age: ${API2API_LOGIN_COOKIE_MAX_AGE:30d}
        http-only: true
        same-site: lax
        secure: ${API2API_LOGIN_COOKIE_SECURE:true}

api2api:
  bootstrap-admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
  security:
    api-key-material:
      encryption-key: ${API2API_API_KEY_ENCRYPTION_KEY:}
      key-version: 1
  provider-http:
    connect-timeout: ${API2API_CONNECT_TIMEOUT:10s}
    models-read-timeout: 30s
    models-max-retries: 1
    upstream-host-override: ${API2API_UPSTREAM_HOST_OVERRIDE:${APP_UPSTREAM_HOST_OVERRIDE:}}
    allow-insecure-hosts: ${API2API_PROVIDER_HTTP_ALLOW_INSECURE_HOSTS:false}
    upstream-read-timeout: ${API2API_UPSTREAM_READ_TIMEOUT:10m}
    streaming-first-byte-timeout: ${API2API_STREAMING_FIRST_BYTE_TIMEOUT:5m}
    streaming-idle-timeout: ${API2API_STREAMING_IDLE_TIMEOUT:10m}
    streaming-max-retries: ${API2API_STREAMING_MAX_RETRIES:2}
    streaming-retry-backoff: ${API2API_STREAMING_RETRY_BACKOFF:200ms}
  gateway:
    model-rate-limit-isolation: ${API2API_MODEL_RATE_LIMIT_ISOLATION:PT1M}
    model-daily-limit-zone: ${API2API_MODEL_DAILY_LIMIT_ZONE:Asia/Shanghai}
  protocol:
    reasoning-model-prefixes: gpt-5,o1,o3,o4
    reasoning-model-contains: codex
